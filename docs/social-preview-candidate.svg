<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Presentation Studio Social Preview Candidate</title>
  <desc id="desc">A GitHub social preview candidate showing an AI Agent workflow for editable PPTX, HTML, PDF, and visual outputs.</desc>
  <defs>
