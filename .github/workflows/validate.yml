name: Validate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify repository health
        run: python scripts/verify_repository_health.py
      - name: Run unit and repository contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify bilingual example products
        run: python scripts/verify_examples.py
      - name: Build deterministic packages in runner temp
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/presentation-studio-package"
          mkdir -p "$package_dir"
          python scripts/build_package.py --archive "$package_dir/presentation-studio-a.zip" --checksum "$package_dir/presentation-studio-a.zip.sha256"
          python scripts/build_package.py --archive "$package_dir/presentation-studio-b.zip" --checksum "$package_dir/presentation-studio-b.zip.sha256"
          cmp --silent "$package_dir/presentation-studio-a.zip" "$package_dir/presentation-studio-b.zip"
          sha_a="$(cut -d ' ' -f1 "$package_dir/presentation-studio-a.zip.sha256")"
          sha_b="$(cut -d ' ' -f1 "$package_dir/presentation-studio-b.zip.sha256")"
          [[ "$sha_a" == "$sha_b" ]]
      - name: Verify folder, catalogs, provenance, and ZIP parity
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/presentation-studio-package"
          python scripts/verify_package.py --archive "$package_dir/presentation-studio-a.zip" --checksum "$package_dir/presentation-studio-a.zip.sha256"
          python scripts/verify_package.py --archive "$package_dir/presentation-studio-b.zip" --checksum "$package_dir/presentation-studio-b.zip.sha256"
      - name: Ensure tracked release outputs remain unchanged
        run: git diff --exit-code -- dist/presentation-studio.zip checksums.sha256

