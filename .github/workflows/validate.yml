name: Validate package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify repository health
        run: python scripts/verify_repository_health.py
      - name: Run unit and repository contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify bilingual example products
        run: python scripts/verify_examples.py
      - name: Rebuild deterministic package
        run: python scripts/build_package.py
      - name: Verify folder, catalogs, provenance, and ZIP parity
        run: python scripts/verify_package.py

