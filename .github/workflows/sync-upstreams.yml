name: Sync stable upstream releases

on:
  repository_dispatch:
    types: [upstream_release]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  synchronize:
    strategy:
      fail-fast: false
      matrix:
        source:
          - ppt-master
          - guizang-ppt-skill
          - frontend-slides
          - baoyu-skills
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: upstream-release-sync-${{ matrix.source }}
      cancel-in-progress: false
    env:
      SOURCE: ${{ matrix.source }}
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Require trusted GitHub App credentials
        shell: bash
        env:
          APP_ID: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$APP_ID" ]]; then
            echo "::error::Trusted GitHub App ID is missing. Configure repository variable UPSTREAM_SYNC_APP_ID."
            exit 1
          fi
          if [[ -z "$APP_PRIVATE_KEY" ]]; then
            echo "::error::Trusted GitHub App private key is missing. Configure repository secret UPSTREAM_SYNC_APP_PRIVATE_KEY."
            exit 1
          fi
      - name: Create repository-scoped trusted automation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.UPSTREAM_SYNC_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-metadata: read
          permission-contents: write
          permission-pull-requests: write
      - name: Resolve trusted App bot commit identity
        id: app-user
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          APP_LOGIN="${APP_SLUG}[bot]"
          APP_GRAPHQL_LOGIN="app/${APP_SLUG}"
          APP_USER_ID="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq '.id')"
          [[ "$APP_USER_ID" =~ ^[0-9]+$ ]] || {
            echo "Trusted GitHub App bot user ID is missing or invalid for deterministic commit attribution." > "$RUNNER_TEMP/blocker.txt"
            exit 1
          }
          echo "login=$APP_LOGIN" >> "$GITHUB_OUTPUT"
          echo "graphql_login=$APP_GRAPHQL_LOGIN" >> "$GITHUB_OUTPUT"
          echo "email=${APP_USER_ID}+${APP_LOGIN}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
      - name: Verify trusted automation labels are provisioned (idempotent ensure)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          for label in automation:upstream-sync release:patch release:minor release:major manual-review; do
            encoded_label="$(jq -rn --arg label "$label" '$label | @uri')"
            actual_label="$(gh api "repos/$GITHUB_REPOSITORY/labels/$encoded_label" --jq '.name' 2> "$RUNNER_TEMP/label-read.err" || true)"
            if [[ -z "$actual_label" ]]; then
              color="1D76DB"
              case "$label" in
                release:patch) color="0E8A16" ;;
                release:minor) color="5319E7" ;;
                release:major) color="B60205" ;;
                manual-review) color="FBCA04" ;;
              esac
              gh api --method POST "repos/$GITHUB_REPOSITORY/labels" \
                -f "name=$label" -f "color=$color" -f "description=Presentation Studio automation control label" \
                > /dev/null 2> "$RUNNER_TEMP/label-create.err" || true
              actual_label="$(gh api "repos/$GITHUB_REPOSITORY/labels/$encoded_label" --jq '.name' 2> "$RUNNER_TEMP/label-readback.err" || true)"
            fi
            [[ "$actual_label" == "$label" ]] || {
              echo "::error::Required repository label is missing or mismatched: $label"
              cat "$RUNNER_TEMP/label-read.err" "$RUNNER_TEMP/label-create.err" "$RUNNER_TEMP/label-readback.err" 2> /dev/null || true
              exit 1
            }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.9.0"
      - name: Verify repository health
        run: python scripts/verify_repository_health.py
      - name: Check selected stable release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE"
          mkdir -p "$sync_dir"
          python scripts/upstream_sync.py check --source "$SOURCE" --json > "$sync_dir/check.json"
          status="$(jq -r '.sources[0].status' "$sync_dir/check.json")"
          if [[ "$status" == "update_available" ]]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "update=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No stable update for $SOURCE (status: $status)"
          fi
      - name: Select the source-specific synchronization branch
        id: sync_pr
        if: steps.release.outputs.update == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-user.outputs.login }}
          APP_GRAPHQL_LOGIN: ${{ steps.app-user.outputs.graphql_login }}
          APP_EMAIL: ${{ steps.app-user.outputs.email }}
        run: |
          set -euo pipefail
          selection="$(
            gh pr list --state open --base main --limit 100 \
              --json headRefName,url,isCrossRepository,author,labels \
              | jq --arg source "$SOURCE" --arg app "$APP_GRAPHQL_LOGIN" '
                  map(select(
                    (.isCrossRepository == false)
                    and (.author.login == $app)
                    and ([.labels[].name] | index("automation:upstream-sync") != null)
                    and (.headRefName | startswith(("automation/sync-" + $source + "-")))
                  )) | if length == 0 then {} elif length == 1 then .[0] else error("multiple trusted automation PRs found for this source") end'
          )"
          sync_branch="$(jq -r '.headRefName // ""' <<< "$selection")"
          existing_pr="$(jq -r '.url // ""' <<< "$selection")"
          git config user.name "$APP_LOGIN"
          git config user.email "$APP_EMAIL"
          if [[ -n "$sync_branch" ]]; then
            auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" fetch origin "$sync_branch"
            git switch --create "$sync_branch" --track "origin/$sync_branch"
            git merge --no-edit origin/main
          else
            sync_branch="automation/sync-${SOURCE}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            git switch --create "$sync_branch"
          fi
          echo "branch=$sync_branch" >> "$GITHUB_OUTPUT"
          echo "url=$existing_pr" >> "$GITHUB_OUTPUT"
      - name: Stage the selected upstream release
        id: sync
        if: steps.release.outputs.update == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE"
          python scripts/upstream_sync.py sync --source "$SOURCE" --report "$sync_dir/sync.json" > "$sync_dir/sync-output.json"
          changed="$(jq -r '.changed | tostring' "$sync_dir/sync.json")"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [[ "$changed" != "true" ]]; then
            echo "::notice::The selected source became current before staging; no PR change is required."
          fi
      - name: Verify repository health after source update
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/verify_repository_health.py
      - name: Run unit and repository contract tests
        if: steps.sync.outputs.changed == 'true'
        run: python -m unittest discover -s tests -v
      - name: Verify bilingual example products
        if: steps.sync.outputs.changed == 'true'
        run: python scripts/verify_examples.py
      - name: Build deterministic packages in runner temp
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE/package"
          python scripts/build_package.py \
            --archive "$package_dir/presentation-studio-a.zip" \
            --checksum "$package_dir/presentation-studio-a.zip.sha256" \
            --compare-archive "$package_dir/presentation-studio-b.zip" \
            --compare-checksum "$package_dir/presentation-studio-b.zip.sha256"
      - name: Verify package and archive parity
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE/package"
          python scripts/verify_package.py \
            --archive "$package_dir/presentation-studio-a.zip" \
            --checksum "$package_dir/presentation-studio-a.zip.sha256" \
            --smoke
          python scripts/verify_package.py \
            --archive "$package_dir/presentation-studio-b.zip" \
            --checksum "$package_dir/presentation-studio-b.zip.sha256" \
            --smoke
      - name: Verify source scope before staging
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE"
          git diff --no-renames --name-only origin/main > "$sync_dir/changed-paths.txt"
          python scripts/upstream_sync.py verify-scope --source "$SOURCE" --paths-file "$sync_dir/changed-paths.txt"
      - name: Stage only reported source paths
        id: changes
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE"
          mapfile -t staging_paths < <(jq -r '.applied[0].staging_paths[]' "$sync_dir/sync.json")
          if ((${#staging_paths[@]} == 0)); then
            echo "::error::The source sync report did not provide staging paths."
            exit 1
          fi
          git add -- "${staging_paths[@]}"
          git diff --cached --no-renames --name-only > "$sync_dir/staged-paths.txt"
          python scripts/upstream_sync.py verify-scope --source "$SOURCE" --paths-file "$sync_dir/staged-paths.txt"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Render source-specific pull request evidence
        id: pr_body
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sync_dir="$RUNNER_TEMP/presentation-studio-upstream/$SOURCE"
          changed_file_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          read -r additions deletions < <(
            git diff --cached --numstat | awk '
              BEGIN { additions = 0; deletions = 0 }
              $1 ~ /^[0-9]+$/ { additions += $1; deletions += $2 }
              END { print additions, deletions }
            '
          )
          release_tag="$(jq -r '.sources[0].release.tag' "$sync_dir/sync.json")"
          pr_title="chore(upstream): update $SOURCE to $release_tag"
          workflow_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          python scripts/upstream_sync.py render-pr-body \
            --report "$sync_dir/sync.json" \
            --output "$sync_dir/pr-body.md" \
            --changed-files "$changed_file_count" \
            --additions "$additions" \
            --deletions "$deletions" \
            --workflow-url "$workflow_url"
          echo "title=$pr_title" >> "$GITHUB_OUTPUT"
          echo "body=$sync_dir/pr-body.md" >> "$GITHUB_OUTPUT"
      - name: Open or update the source-specific pull request
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_LOGIN: ${{ steps.app-user.outputs.login }}
          APP_GRAPHQL_LOGIN: ${{ steps.app-user.outputs.graphql_login }}
          APP_EMAIL: ${{ steps.app-user.outputs.email }}
          SYNC_BRANCH: ${{ steps.sync_pr.outputs.branch }}
          EXISTING_PR: ${{ steps.sync_pr.outputs.url }}
          PR_TITLE: ${{ steps.pr_body.outputs.title }}
          PR_BODY: ${{ steps.pr_body.outputs.body }}
        run: |
          set -euo pipefail
          git config user.name "$APP_LOGIN"
          git config user.email "$APP_EMAIL"
          git commit -m "$PR_TITLE"
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 --wrap=0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth_header" push --set-upstream origin "$SYNC_BRANCH"
          if [[ -n "$EXISTING_PR" ]]; then
            current_pr="$(gh pr view "$EXISTING_PR" --json state,headRefName,isCrossRepository)"
            jq -e --arg branch "$SYNC_BRANCH" \
              'select((.state == "OPEN") and (.isCrossRepository == false) and (.headRefName == $branch))' \
              <<< "$current_pr" > /dev/null
            gh pr edit "$EXISTING_PR" \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY" \
              --add-label "automation:upstream-sync" \
              --add-label "release:patch"
            pr_url="$EXISTING_PR"
          else
            pr_url="$(gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY" \
              --label "automation:upstream-sync" \
              --label "release:patch")"
          fi
          readback="$(gh pr view "$pr_url" --json state,baseRefName,headRefName,isCrossRepository,isDraft,author,labels)"
          jq -e \
            --arg branch "$SYNC_BRANCH" \
            --arg app "$APP_GRAPHQL_LOGIN" \
            'select(
              (.state == "OPEN")
              and (.baseRefName == "main")
              and (.headRefName == $branch)
              and (.isCrossRepository == false)
              and (.isDraft == false)
              and (.author.login == $app)
              and ([.labels[].name] | index("automation:upstream-sync") != null)
              and ([.labels[].name] | index("release:patch") != null)
            )' <<< "$readback" > /dev/null
      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upstream-sync-report-${{ matrix.source }}
          path: ${{ runner.temp }}/presentation-studio-upstream/${{ matrix.source }}
          if-no-files-found: warn
          retention-days: 14
