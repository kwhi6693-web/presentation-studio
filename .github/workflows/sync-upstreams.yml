name: Sync stable upstream releases

on:
  repository_dispatch:
    types: [upstream_release]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select the synchronization pull request branch
        id: sync_pr
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          selection="$(
            gh pr list --state open --base main --limit 100 \
              --json headRefName,url,isCrossRepository \
              --jq 'map(select((.isCrossRepository == false) and (.headRefName | test("^automation/sync-stable-upstreams-[0-9]+-[0-9]+$")))) | first // {}'
          )"
          sync_branch="$(jq -r '.headRefName // ""' <<< "$selection")"
          existing_pr="$(jq -r '.url // ""' <<< "$selection")"
          if [[ -n "$sync_branch" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "$sync_branch"
            git switch --create "$sync_branch" --track "origin/$sync_branch"
            git merge --no-edit origin/main
          else
            sync_branch="automation/sync-stable-upstreams-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "branch=$sync_branch" >> "$GITHUB_OUTPUT"
          echo "url=$existing_pr" >> "$GITHUB_OUTPUT"
      - name: Stage latest stable upstream releases
        run: python scripts/upstream_sync.py sync --all --report artifacts/upstream-sync-report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run unit and repository contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify bilingual example products
        run: python scripts/verify_examples.py
      - name: Build deterministic package
        run: python scripts/build_package.py
      - name: Verify package and archive parity
        run: python scripts/verify_package.py
      - name: Stage verified changes
        id: changes
        shell: bash
        run: |
          git add -- \
            presentation-studio/engines \
            presentation-studio/source-lock.json \
            dist/presentation-studio.zip \
            checksums.sha256
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open a pull request for synchronized sources
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.sync_pr.outputs.branch }}
          EXISTING_PR: ${{ steps.sync_pr.outputs.url }}
        run: |
          set -euo pipefail
          sync_branch="$SYNC_BRANCH"
          existing_pr="$EXISTING_PR"
          ensure_existing_pr_open() {
            current_pr_json="$(
              gh pr view "$existing_pr" --json state,headRefName,isCrossRepository,url
            )"
            current_pr_url="$(
              jq -r --arg branch "$sync_branch" \
                'select((.state == "OPEN") and (.isCrossRepository == false) and (.headRefName == $branch)) | .url // ""' \
                <<< "$current_pr_json"
            )"
            if [[ "$current_pr_url" != "$existing_pr" ]]; then
              echo "::error::Synchronization PR changed state during validation; rerun from current main."
              exit 1
            fi
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -z "$existing_pr" ]]; then
            git switch -c "$sync_branch"
          else
            ensure_existing_pr_open
          fi
          git commit -m "chore: sync stable upstream releases"
          git push --set-upstream origin "$sync_branch"
          if [[ -n "$existing_pr" ]]; then
            ensure_existing_pr_open
            echo "::notice::Updated verified upstream changes in $existing_pr"
          else
            gh pr create \
              --base main \
              --head "$sync_branch" \
              --title "chore: sync stable upstream releases" \
              --body "Automated verified update from workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
          fi
      - name: Upload synchronization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-report
          path: artifacts/upstream-sync-report.json
          if-no-files-found: warn
          retention-days: 14
